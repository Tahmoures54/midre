name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: Assemble release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install JS dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Pack assets for Android WebView
        run: node scripts/prepare-apk-web.mjs

      - name: Assemble APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/yadavar-daru.apk
          ls -lh dist/yadavar-daru.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yadavar-daru-apk
          path: dist/yadavar-daru.apk
          if-no-files-found: error
